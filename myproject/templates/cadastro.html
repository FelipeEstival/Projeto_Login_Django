<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-start: #6C63FF;
      --brand-end: #8A7CFF;
      --brand-dark: #4B3FE0;
    }

    * {
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--brand-start), var(--brand-end));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 1100px;
      min-height: 620px;
      position: relative;
      display: flex;
      align-items: center;
    }

    /* Lado esquerdo - mensagem de boas-vindas */
    .left-side {
      flex: 1;
      color: #fff;
      padding: 40px 60px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 60px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border: 2px solid #fff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-name {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .left-side h1 {
      font-weight: 700;
      font-size: 2.6rem;
      margin-bottom: 18px;
    }

    .left-side h2 {
      font-weight: 500;
      font-size: 1.2rem;
      margin-bottom: 18px;
    }

    .left-side p {
      font-size: 0.95rem;
      opacity: 0.85;
      max-width: 380px;
      line-height: 1.6;
    }

    /* Card de cadastro */
    .login-card {
      background: #fff;
      border-radius: 24px;
      padding: 50px 45px;
      box-shadow: 0 25px 60px rgba(38, 27, 105, 0.35);
      width: 100%;
      max-width: 420px;
      margin-left: auto;
    }

    .login-card h3 {
      font-weight: 700;
      color: #2b2450;
      margin-bottom: 6px;
    }

    .login-card .subtitle {
      color: #8b87a3;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .form-label {
      font-size: 0.85rem;
      color: #4b4368;
      font-weight: 500;
    }

    .form-control {
      background-color: #f5f4fb;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .form-control:focus {
      background-color: #f0eefc;
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
    }

    .btn-login {
      background: linear-gradient(135deg, var(--brand-start), var(--brand-dark));
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      width: 100%;
      transition: opacity 0.2s ease;
      margin-top: 6px;
    }

    .btn-login:hover {
      opacity: 0.9;
      color: #fff;
    }

    .signup-text {
      text-align: center;
      font-size: 0.85rem;
      color: #6b6685;
      margin-top: 28px;
    }

    .signup-text a {
      color: var(--brand-start);
      font-weight: 600;
      text-decoration: none;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .login-wrapper {
        flex-direction: column;
      }

      .left-side {
        padding: 20px;
        text-align: center;
      }

      .brand {
        justify-content: center;
      }

      .left-side p {
        margin: 0 auto;
      }

      .login-card {
        margin: 30px auto 0 auto;
      }
    }

        .messages-wrapper {
      margin-bottom: 18px;
    }

    .alert-custom {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 10px;
      border: 1px solid transparent;
    }

    .alert-custom.alert-success {
      background-color: #eafaf0;
      color: #1e9e5e;
      border-color: #b7ebce;
    }

    .alert-custom.alert-error {
      background-color: #fdeeee;
      color: #d9463f;
      border-color: #f7c6c4;
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <div class="left-side">
        <div class="brand">
          <span class="brand-name">Projeto estudos Estival</span>
        </div>

        <h1>Crie sua conta!</h1>
        <h2>Leva menos de um minuto</h2>

    </div>
    <!-- Card de cadastro -->
      <div class="login-card">
          <h3>Cadastre-se</h3>
          <p class="subtitle">Preencha os dados abaixo para criar sua conta.</p>

          {% if messages %}
              <div class="messages-wrapper">
              {% for message in messages %}
                <div class="alert-custom alert-{{ message.tags }}">
                {{ message }}
                </div>
              {% endfor %}
              </div>
          {% endif %}

          <form method="POST" action="">
          {% csrf_token %}

            <label for="nome" class="form-label">Nome Completo</label>
            <input type="text" class="form-control" id="nome" placeholder="Digite seu nome completo" 
            required name="name" value={{name}}>

            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com" required
            name="email" value={{email}}>

            <label for="password" class="form-label">Senha</label>
            <input type="password" class="form-control" id="password" placeholder="Digite sua senha" required
            name="password">

            <label for="idade" class="form-label">Idade</label>
            <input type="number" class="form-control" id="idade" placeholder="Digite sua idade" min="0" required
            name="age" value={{age}}>

            <button type="submit" class="btn btn-login">Cadastrar</button>

          </form>

          <p class="signup-text">
          Já tem uma conta? <a href="{% url 'login' %}">Entrar</a>
          </p>
      </div>
  </div>

</body>

</html>
